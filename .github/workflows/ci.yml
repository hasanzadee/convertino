name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build src/Convertino.Windows -c Release
      - name: CLI smoke test
        shell: pwsh
        run: |
          dotnet publish src/Convertino.Windows -c Release -r win-x64 --self-contained -o dist/win-x64 -v q
          Copy-Item packaging/linux/icons/convertino-256.png smoke.png
          $p = Start-Process dist/win-x64/Convertino.exe -ArgumentList 'convert','smoke.png','--to','webp' -Wait -PassThru
          if (-not (Test-Path smoke.webp)) { throw "conversion failed ($($p.ExitCode))" }
          $env:CONVERTINO_APPDATA = Join-Path $PWD 'ci-appdata'
          $p = Start-Process dist/win-x64/Convertino.exe -ArgumentList 'recipe','add','Web-ready','--steps','fithd,to-webp,meta' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "recipe add failed ($($p.ExitCode))" }
          $p = Start-Process dist/win-x64/Convertino.exe -ArgumentList 'recipe','run','Web-ready','smoke.png' -Wait -PassThru
          if (-not (Test-Path 'smoke (Web-ready).webp')) { throw "recipe run failed ($($p.ExitCode))" }
          if (Get-ChildItem (Join-Path $env:TEMP 'convertino') -Filter 'recipe-*' -ErrorAction SilentlyContinue) { throw "a recipe work folder was left behind" }
      - name: Browser drop self-test
        shell: pwsh
        run: |
          $p = Start-Process dist/win-x64/Convertino.exe -ArgumentList '--browser-drop-selftest','webtest' -Wait -PassThru
          Get-Content webtest/results.txt
          if ($p.ExitCode -ne 0) { throw "$($p.ExitCode) browser-drop checks failed" }
      - name: Clipboard + capture self-tests
        shell: pwsh
        run: |
          # synthetic clipboard payloads through the real reader, offers and petals; flowers and the overlay as PNGs
          Start-Process dist/win-x64/Convertino.exe -ArgumentList '--clip-selftest', "$PWD\clip-selftest" -Wait
          Get-Content clip-selftest/results.txt
          if (-not (Select-String -Path clip-selftest/results.txt -Pattern '^ALL PASS' -Quiet)) { throw "clipboard self-test failed" }
          Start-Process dist/win-x64/Convertino.exe -ArgumentList '--capture-selftest', "$PWD\clip-selftest\capture-overlay.png" -Wait
          if (-not (Test-Path clip-selftest/capture-overlay.png)) { throw "capture overlay didn't render" }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-clip-selftest
          path: clip-selftest/

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build src/Convertino.Linux -c Release
      - name: CLI smoke test
        run: |
          dotnet publish src/Convertino.Linux -c Release -r linux-x64 --self-contained -o dist/linux-x64 -v q
          cp packaging/linux/icons/convertino-256.png smoke.png
          ./dist/linux-x64/convertino convert smoke.png --to webp
          ./dist/linux-x64/convertino run compress smoke.png
          test -f smoke.webp
          printf '1\r\n00:00:01,234 --> 00:00:02,500\r\n<i>\xcf\xf0\xe8\xe2\xe5\xf2</i>\r\n' > smoke.srt
          ./dist/linux-x64/convertino convert smoke.srt --to vtt
          grep -q '00:00:01.234 --> 00:00:02.500' smoke.vtt
          grep -q '<i>Привет</i>' smoke.vtt
          printf 'one\r\ntwo\n\xcf\xf0\xe8\xe2\xe5\xf2\r\n' > smoke.txt
          ./dist/linux-x64/convertino run utf8 smoke.txt
          grep -q 'Привет' 'smoke (UTF-8).txt'
          ./dist/linux-x64/convertino run lf smoke.txt
          test "$(tr -cd '\r' < 'smoke (LF).txt' | wc -c)" -eq 0
          printf '[{"id":1,"name":"Şəki, \\"AZ\\"","tags":["a","b"]},{"id":2,"name":"Bakı"}]' > data.json
          ./dist/linux-x64/convertino convert data.json --to yaml
          ./dist/linux-x64/convertino convert data.yaml --to xlsx
          ./dist/linux-x64/convertino convert data.xlsx --to csv
          grep -q 'Şəki, ""AZ""' data.csv
          ./dist/linux-x64/convertino convert data.csv --to md
          grep -q '| Şəki, "AZ" |' data.md
          printf 'a :hover { color : red } /* x */\n' > site.css
          ./dist/linux-x64/convertino run minify site.css
          grep -qx 'a :hover{color:red}' 'site (min).css'
          # live preview: every petal worked out ahead, the "drop" on WEBP served from that run (smoke.webp exists: "smoke (2).webp")
          ./dist/linux-x64/convertino preview smoke.png --take to-webp | tee preview.log
          grep -q 'to-avif' preview.log
          test -s 'smoke (2).webp'
          test -z "$(ls -A /tmp/convertino/preview 2>/dev/null)"
      - name: Archives and file tools
        run: bash tools/files-smoke.sh dist/linux-x64/convertino
      - name: Recipes and custom commands
        run: bash tools/recipes-smoke.sh dist/linux-x64/convertino
      - name: Browser drops (self-test, fetch)
        run: |
          ./dist/linux-x64/convertino --browser-drop-selftest webtest
          mkdir -p site && cp smoke.png site/pic.png
          (cd site && python3 -m http.server 8765 --bind 127.0.0.1 >/dev/null 2>&1 &)
          sleep 1
          ./dist/linux-x64/convertino fetch http://127.0.0.1:8765/pic.png --to jpg --out fetched
          test -s fetched/pic.png && test -s fetched/pic.jpg
          getfattr -n user.xdg.origin.url fetched/pic.png fetched/pic.jpg || true
      - name: Clipboard (Xvfb + xclip)
        run: |
          sudo apt-get install -y -qq xvfb xclip > /dev/null
          Xvfb :91 -screen 0 1280x800x24 &
          sleep 2
          DISPLAY=:91 bash tools/clip-smoke.sh dist/linux-x64/convertino

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-latest, arch: arm64 }
          - { runner: macos-15-intel, arch: x64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Build Convertino.app
        run: |
          chmod +x packaging/macos/*.sh tools/mac-smoke.sh
          packaging/macos/build-app.sh ${{ matrix.arch }} dist
      - name: Cut-out model cache
        if: matrix.arch == 'arm64'
        uses: actions/cache@v6
        with:
          path: ~/Library/Application Support/Convertino/models
          key: birefnet-lite-5600024376f5
      - name: Smoke test
        env:
          CUTOUT: ${{ matrix.arch == 'arm64' && '1' || '' }}
        run: tools/mac-smoke.sh dist/Convertino.app ${{ matrix.arch == 'arm64' && '--gui' || '' }}
      - name: Zip the app
        if: always()
        run: ditto -c -k --keepParent dist/Convertino.app convertino-macos-${{ matrix.arch }}-ci.zip
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: macos-${{ matrix.arch }}
          path: |
            mac-smoke/
            convertino-macos-${{ matrix.arch }}-ci.zip
